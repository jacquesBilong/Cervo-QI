/* Identité africaine contemporaine — dessin vectoriel intégré, aucun fichier extérieur */
:root{--bg:#f5eee0;--surface:#fffaf1;--tile:#f8f0e3;--ink:#1c2b26;--muted:#617069;--line:#e1d5c0;--accent:#08735b;--accent-ink:#ffffff;--yellow:#f5c14f;--coral:#ce6343;--pattern:#cb743b}
:root[data-theme=dark]{--bg:#141c19;--surface:#23312b;--tile:#2e3b33;--ink:#f6f3e9;--muted:#bec7bc;--line:#536054;--accent:#78dab2;--accent-ink:#13382c;--yellow:#f4c86c;--coral:#ed9769;--pattern:#986946}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{overflow-x:hidden;background: radial-gradient(ellipse at 100% 0%,#d98e4a44 0%,transparent 37%),radial-gradient(ellipse at 0% 85%,#32634416,transparent 43%),var(--bg);min-height:100dvh;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));}
body::before{position:fixed;z-index:-1;inset:0;content:'';opacity:.16;pointer-events:none;background-image:repeating-linear-gradient(45deg,transparent 0 26px,var(--pattern) 26px 28px,transparent 28px 54px),repeating-linear-gradient(-45deg,transparent 0 26px,var(--pattern) 26px 28px,transparent 28px 54px);mask-image:linear-gradient(90deg,#000,transparent 35%,transparent 65%,#000)}
.wrap{max-width:680px;min-width:0;width:100%;gap:16px}
.brand{border:1px solid #bc8c5970;border-radius:18px;background:color-mix(in srgb,var(--surface) 94%,transparent);padding:10px 14px;min-width:0}
.logo{font-size:clamp(1.21rem,4.5vw,1.55rem);white-space:nowrap;gap:6px}
.logo svg{width:31px;height:31px}
.chip{font-size:.76rem;white-space:nowrap}
.mini{min-width:42px;min-height:42px;display:grid;place-items:center;border-radius:13px}
.card{position:relative;isolation:isolate;overflow:hidden;border-color:var(--line);border-radius:23px;box-shadow:0 6px 28px #3325160d}
.card::before{content:'';position:absolute;height:5px;left:0;right:0;top:0;background:repeating-linear-gradient(90deg,#aa512f 0 14px,#efb458 14px 25px,#145d49 25px 40px,#efb458 40px 49px);opacity:.88}
.eyebrow{color:var(--accent)}
.facts,.resultGrid,.people,.options,.guessChoices,.memoOptions{min-width:0}
.facts>* ,.resultGrid>*,.people>*,.options>*,.guessChoices>*{min-width:0}
.fact{border:1px solid color-mix(in srgb,var(--line) 78%,transparent)}
.btn{touch-action:manipulation;min-height:55px;box-shadow:0 3px 0 #18392b12;transition:transform .15s,filter .15s}
.btn:not(:disabled):hover{filter:brightness(1.05)}
.option,.memoOpt,.guessChoices button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.option{min-height:60px;overflow-wrap:anywhere}
.qtext{font-size:clamp(1.05rem,3vw,1.2rem)}
.matrix{box-shadow:inset 0 0 0 1px #99643b22;max-width:min(360px,100%)}
.cell{color:var(--ink)}
.option.visualOpt{min-height:76px}
.timeTrack span{transition:width .13s linear}
.meter span{background:linear-gradient(90deg,#d78043,var(--accent))}
.africa-scene{min-height:148px;height:clamp(150px,31vw,245px);border:1px solid #9b6134;border-radius:23px;overflow:hidden;box-shadow:0 8px 25px #493a2630;position:relative;background:#774129}
.africa-scene svg{display:block;width:100%;height:100%;object-fit:cover}
.africa-scene .scene-label{position:absolute;left:17px;bottom:15px;color:#fff7df;background:#122920ad;border:1px solid #ffffff26;border-radius:12px;padding:8px 12px;font-weight:800;font-size:clamp(.84rem,3vw,1.1rem);backdrop-filter:blur(5px);max-width:calc(100% - 36px)}
.intro-kicker{color:#955331;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.77rem}

.brand-edition{letter-spacing:.035em;color:var(--accent);font-size:.79rem;font-weight:800}
.score{background:radial-gradient(circle at 70% 0%,#c9894b50,transparent 35%),linear-gradient(145deg,#154d3e,#112c2a);color:#fff9e8;border-color:#ba884f}
.score::before{height:7px}
.score .scoreNum{color:#ffd36c;text-shadow:0 3px 22px #f4b24b30}
.score .scoreNum small{color:#e7e0cb}
.score .muted{color:#e4e8da}
.score .eyebrow{color:#ffce75}
.score .fact{background:#ffffff19;border-color:#ffffff36}
.score .fact small{color:#e8e4d8}
.score .meter{background:#ffffff2c}
.person{border-left:4px solid var(--coral);overflow-wrap:anywhere}
.person .personIQ{font-size:1.15rem}
.footer{padding-bottom:max(5px,env(safe-area-inset-bottom));line-height:1.5}
.african-divider{height:13px;border-radius:6px;background:repeating-linear-gradient(90deg,#0c5843 0 15px,#f4c16c 15px 23px,#c7683d 23px 30px,#f4c16c 30px 37px,#0c5843 37px 52px);opacity:.85}

function shape(s,cx,cy,r,f='empty',rot=0){let fill=f==='solid'?'currentColor':f==='half'?'url(#hatch)':'none';let a=`stroke="currentColor" stroke-width="3" stroke-linejoin="round" fill="${fill}"`;if(s==='circle')return `<circle cx="${cx}" cy="${cy}" r="${r*.9}" ${a}/>`;if(s==='square')return `<polygon points="${polys(4,cx,cy,r*1.15,45+rot)}" ${a}/>`;if(s==='diamond')return `<polygon points="${polys(4,cx,cy,r*1.1,rot)}" ${a}/>`;if(s==='triangle')return `<polygon points="${polys(3,cx,cy+r*.15,r*1.1,rot)}" ${a}/>`;if(s==='pentagon'||s==='hexagon')return `<polygon points="${polys(s==='pentagon'?5:6,cx,cy,r*1.05,rot)}" ${a}/>`;if(s==='arrow'){const p=[[cx,cy-r],[cx+r*.8,cy],[cx+r*.3,cy],[cx+r*.3,cy+r],[cx-r*.3,cy+r],[cx-r*.3,cy],[cx-r*.8,cy]].map(z=>z.join(',')).join(' ');return `<g transform="rotate(${rot} ${cx} ${cy})"><polygon points="${p}" ${a}/></g>`;}return '';}

<g stroke="#f3b86b" stroke-width="3" fill="none" opacity=".95"><path d="M25 28l12 11-12 11-12-11zM46 28l12 11-12 11-12-11z"/><path d="M882 35l12 11-12 11-12-11zM907 35l12 11-12 11-12-11z"/></g></svg><span class="scene-label">🌍 L’Afrique nous inspire. La curiosité nous unit.</span></div>`;}
function intro(){stopTimers();let best='';try{best=localStorage.getItem('cervo-best')||'';}catch{}
render(head(`<span class="chip">${best?'Record '+best:'100 % gratuit'}</span>`)+`<section class="card hero-card fadein"><div class="hero-top"><div class="hero-brandline"><div class="hero-title-logo">${BRAIN} <div>Cervo <span style="color:#ffca3d">QI</span><span class="small">Ton esprit. Notre fierté !</span></div></div><div class="hero-badge">🌍 Afrique · Logique</div></div><h1 class="hero-headline">Découvre la puissance de ton cerveau</h1><p class="hero-sub">Un défi inspiré, chaleureux et accessible, pensé pour captiver dès les premières secondes.</p></div><div class="hero-bottom"><div class="quick-feats"><div class="quick-feat"><b>22</b><span>énigmes</span></div><div class="quick-feat"><b>Mémoire</b><span>logique et rapidité</span></div><div class="quick-feat"><b>Score</b><span>à la fin</span></div></div><form id="startform" class="hero-form"><label for="firstname">Quel est ton prénom ?</label><input id="firstname" autocomplete="given-name" maxlength="24" placeholder="Ton prénom…" required value="${escapeHTML(S.name)}"><button class="cta-xl" type="submit">Commencer maintenant →</button></form><div class="hero-note"><div class="ico">💡</div><div>Ton prénom servira à personnaliser l’expérience et ton résultat, puis à comparer ton indice Cervo à des personnalités du monde et d’Afrique.</div></div></div><div class="pattern-edge"></div></section><section class="card scene-card"><div class="scene-strip"></div><div class="scene-inner"><h3>Un exemple : à toi de jouer</h3><div class="matrix">${Q[0].grid.map(c=>`<div class="cell">${cell(c)}</div>`).join('')}<div class="cell unknown">?</div></div><p class="muted">Observe les lignes, les colonnes et le rythme des formes pour trouver la pièce manquante.</p></div></section><section class="card"><h3>Ce qui t’attend</h3>${LEVELS.map(l=>`<div class="levelrow"><div class="levelnum">${l.n}</div><div><strong>${l.name}</strong><small>${l.sub} · ${l.time} s par question</small></div></div>`).join('')}<p class="note">L’indice affiché à la fin est un <strong>indice ludique Cervo</strong>, pas un QI clinique. Le but ici est de jouer, réfléchir et partager.</p></section>`);
$('#startform').onsubmit=e=>{e.preventDefault();const name=$('#firstname').value.trim().replace(/\s+/g,' ');if(!name)return;S={screen:'level',name,i:0,ans:Q.map(()=>null),order:Q.map(q=>randShuffle(q.opts.length)),sequence:newSequence(),memoIndex:0,memoStars:0,guess:null,lock:false};screen();moveTop();};}
function levelIntro(){stopTimers();const lv=LEVELS[Q[S.sequence[S.i]].lv-1],count=Q.filter(q=>q.lv===lv.n).length;render(head(`<span class="chip">${S.i} / ${Q.length}</span>`)+`<section class="card dark-card center fadein"><div class="bigbadge">${lv.n}</div><span class="eyebrow">Niveau ${lv.n} / 3</span><h2>${escapeHTML(S.name)}, prêt ?</h2><h3>${lv.name}</h3><p class="muted">${lv.sub} ${count} énigmes, ${lv.time} secondes chacune.</p><button id="levelstart" class="cta-xl">C’est parti !</button></section>`);$('#levelstart').onclick=()=>{S.screen='question';screen();moveTop();};}
function question(){const questionId=S.sequence[S.i],q=Q[questionId],ord=S.order[questionId],isPic=Boolean(q.grid),seconds=LEVELS[q.lv-1].time;S.lock=false;const body=q.grid?`<div class="matrix">${q.grid.map(c=>`<div class="cell">${cell(c)}</div>`).join('')}<div class="cell unknown">?</div></div>`:q.seq?`<div class="seq">${escapeHTML(q.seq).replace('?', '<em>?</em>')}</div>`:'';
const opts=ord.map((oi,k)=>{const o=q.opts[oi];return `<button type="button" class="option ${isPic?'visualOpt':''}" data-answer="${oi}" aria-label="Réponse ${'ABCDEF'[k]}${!isPic?' '+escapeHTML(o):''}"><span class="letter">${'ABCDEF'[k]}</span>${isPic?cell(o):escapeHTML(o)}</button>`;}).join('');
render(`<div class="gameTop"><div class="logo">${BRAIN}</div><div class="progress" aria-label="Progression"><span style="width:${100*S.i/Q.length}%"></span></div><span class="chip">${S.i+1} / ${Q.length}</span></div><section class="card fadein"><div class="qmeta"><span class="eyebrow">${CATS[q.cat]}</span><span class="chip">Niveau ${q.lv}</span></div><div class="timerbar" role="timer" aria-label="Temps restant"><span id="remaining" class="clock">${seconds} s</span><div class="timeTrack"><span id="remainingBar"></span></div></div><p class="qtext">${q.q}</p>${body}<div class="options ${isPic?'visual':''} ${q.long?'long':''}">${opts}</div><div id="cheer" class="cheer" aria-live="polite"></div><div class="nav"><span class="muted" style="font-size:.83rem">${escapeHTML(S.name)}, fais-toi confiance.</span><button class="linkbtn" id="skip" type="button">Passer →</button></div></section>`);
function accept(answer,timedOut=false){if(S.lock)return;S.lock=true;stopTimers();S.ans[questionId]=answer;app.querySelectorAll('.option').forEach(b=>{b.disabled=true;b.classList.toggle('selected',Number(b.dataset.answer)===answer);});$('#skip').disabled=true;$('#cheer').textContent=timedOut?'⏰ Temps écoulé. On continue !':answer===null?'Pas de souci, on avance.':['Bien joué !','Tu progresses !','Continue comme ça !','Une de plus !'][Math.floor(Math.random()*4)];autoGo=setTimeout(()=>{autoGo=null;next();},timedOut?850:470);}
app.querySelectorAll('.option').forEach(b=>b.onclick=()=>accept(Number(b.dataset.answer)));$('#skip').onclick=()=>accept(null);clock(seconds,()=>accept(null,true));}
function next(){stopTimers();S.i++;if(S.i>=Q.length){S.screen='guess';}else if(S.i===7||S.i===15){S.memoIndex=S.i===7?0:1;S.screen='memoLearn';}else if(Q[S.sequence[S.i]].lv!==Q[S.sequence[S.i-1]].lv){S.screen='level';}else{S.screen='question';}screen();moveTop();}
function memolearn(){const data=MEMOS[S.memoIndex];render(head(`<span class="chip">Bonus mémoire ✨</span>`)+`<section class="card scene-card center fadein"><div class="scene-strip"></div><div class="scene-inner" style="display:grid;gap:16px"><span class="eyebrow">Défi mémoire</span><h2>Observe bien ces symboles</h2><p class="muted">${escapeHTML(S.name)}, mémorise-les et prépare-toi à répondre à la question suivante.</p><div class="memoSymbols" aria-label="Symboles à retenir">${data.symbols.join(' ')}</div><div class="timerbar" style="width:100%"><span id="remaining" class="clock">7 s</span><div class="timeTrack"><span id="remainingBar"></span></div></div><p class="note">Ce mini-jeu ne bloque pas l’expérience : il sert à garder l’attention et à éviter l’ennui.</p></div></section>`);clock(7,()=>{S.screen='memoRecall';screen();moveTop();});}
function memoRecall(){const data=MEMOS[S.memoIndex],ord=randShuffle(data.opts.length);S.lock=false;render(head('<span class="chip">Mémoire</span>')+`<section class="card scene-card center fadein"><div class="scene-strip"></div><div class="scene-inner" style="display:grid;gap:16px"><h2>Tu te souviens ?</h2><p>Quel symbole était en <strong>${data.which+1}e position</strong> ?</p><div class="timerbar" style="width:100%"><span id="remaining" class="clock">18 s</span><div class="timeTrack"><span id="remainingBar"></span></div></div><div class="memoOptions" style="width:100%">${ord.map(j=>`<button class="memoOpt" type="button" data-symbol="${data.opts[j]}" aria-label="${data.opts[j]}">${data.opts[j]}</button>`).join('')}</div><div id="cheer" class="cheer" aria-live="polite"></div></div></section>`);
function answer(symbol){if(S.lock)return;S.lock=true;stopTimers();const ok=symbol===data.symbols[data.which];if(ok)S.memoStars++;$('#cheer').textContent=ok?'⭐ Bravo, étoile mémoire gagnée !':'C’était '+data.symbols[data.which]+' ! Bien essayé.';app.querySelectorAll('.memoOpt').forEach(b=>b.disabled=true);autoGo=setTimeout(()=>{autoGo=null;S.screen='level';screen();moveTop();},950);}app.querySelectorAll('.memoOpt').forEach(b=>b.onclick=()=>answer(b.dataset.symbol));clock(18,()=>answer(null));}
function compute(){let pts=0,good=0;const categories={};Q.forEach((q,i)=>{const c=categories[q.cat]??(categories[q.cat]={right:0,total:0});c.total++;if(S.ans[i]===0){pts+=q.d;good++;c.right++;}});const ratio=pts/MAXPTS;
// The following is a game index, not a validated IQ estimate, percentile or diagnosis.
const index=Math.max(70,Math.min(145,Math.round(70+ratio*75)));return {pts,good,categories,index,ratio};}
function guess(){stopTimers();const R=compute();render(head(`<span class="chip">${Q.length} / ${Q.length}</span>`)+`<section class="card center fadein"><div class="star">🎉</div><span class="eyebrow">Défi terminé</span><h2>Bravo ${escapeHTML(S.name)} !</h2><p class="muted">Avant de découvrir ton indice QI <strong>de jeu</strong>, essaie de le deviner. Si tu t’approches à 5 points près, tu remportes le badge « Intuition d’or ».</p><div class="guessChoices" style="width:100%">${[95,110,130].map(x=>`<button type="button" data-guess="${x}">${x}</button>`).join('')}</div><div class="field" style="width:100%;text-align:left"><label for="guesscustom">Ou saisis ton pronostic (70 à 145)</label><input id="guesscustom" type="number" min="70" max="145" required placeholder="Mon pronostic"></div><button id="reveal" class="btn">Révéler mon résultat 🎁</button><button id="noGuess" class="linkbtn">Voir directement mon résultat</button></section>`);
app.querySelectorAll('[data-guess]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-guess]').forEach(x=>x.classList.toggle('selected',x===b));$('#guesscustom').value=b.dataset.guess;});$('#reveal').onclick=()=>{let v=Number($('#guesscustom').value);if(!Number.isInteger(v)||v<70||v>145){$('#guesscustom').focus();$('#guesscustom').reportValidity();return;}S.guess=v;S.screen='results';screen();moveTop();};$('#noGuess').onclick=()=>{S.guess=null;S.screen='results';screen();moveTop();};}
function resultCaption(index){if(index>=132)return'Tu as brillamment résolu ce défi !';if(index>=115)return'Très belle réussite sur les énigmes.';if(index>=98)return'Tu as bien progressé à travers les niveaux.';return'Chaque défi est une occasion de progresser.';}
function results(){stopTimers();const R=compute(),pct=Math.round(R.good/Q.length*100);try{const best=Number(localStorage.getItem('cervo-best'))||0;if(R.index>best)localStorage.setItem('cervo-best',String(R.index));}catch{}
let badge='';if(S.guess!==null){const dist=Math.abs(S.guess-R.index);badge=dist<=5?`<p><strong>🏅 Intuition d’or !</strong> Ton pronostic ${S.guess} était très proche.</p>`:`<p>Tu avais imaginé ${S.guess}. Ton indice de jeu est ${R.index} : jolie surprise !</p>`;}
const cats=Object.entries(CATS).map(([k,label])=>{const c=R.categories[k],p=Math.round(c.right/c.total*100);return `<div class="category"><span>${label}</span><b>${c.right} / ${c.total}</b><div class="meter"><span style="width:${p}%"></span></div></div>`;}).join('');
const people=(rows)=>rows.map((p,i)=>`<div class="rank-item"><div class="avatar">${['🧠','🌍','⭐','📘','🏛️','🎓','🏆','📚'][i%8]}</div><div><b>${escapeHTML(p.name)}</b><small>${escapeHTML(p.where)}</small></div><div class="personIQ ${p.iq.startsWith('Non')?'unknown':''}">${escapeHTML(p.iq)}</div></div>`).join('');
const solutions=Q.map((q,i)=>`<div class="solution ${S.ans[i]===0?'good':'bad'}"><b>${i+1}. ${S.ans[i]===0?'✓ Réussi':S.ans[i]===null?'— Passé / temps écoulé':'✗ À revoir'} · ${CATS[q.cat]}</b>${escapeHTML(q.why)}${q.grid?'':' Réponse : '+escapeHTML(q.opts[0])}.</div>`).join('');
render(head('<span class="chip">Mon résultat</span>')+`<section class="card dark-card fadein"><div class="result-hero"><div class="crown">👑</div><h2>Félicitations ${escapeHTML(S.name)} !</h2><p class="muted">Ton indice Cervo QI estimé est</p><div class="result-big">${R.index}</div><p>Tu as réussi <strong>${R.good}</strong> énigmes sur <strong>22</strong> et obtenu <strong>${S.memoStars}</strong> étoile(s) mémoire.</p><div class="resultGrid" style="margin-top:14px;width:100%"><div class="fact"><b>${R.good} / 22</b><small>bonnes réponses</small></div><div class="fact"><b>${pct} %</b><small>réussite</small></div><div class="fact"><b>${S.memoStars} / 2</b><small>mémoire</small></div></div><p style="margin-top:14px"><span class="result-pill">Toi ${R.index}</span></p>${badge}</div><p class="note">Cet indice reste ludique. Il n’équivaut pas à une mesure psychométrique officielle.</p></section><section class="card"><h3>Ton cerveau en action</h3>${cats}<details><summary>Voir les 22 solutions expliquées</summary>${solutions}</details></section><section class="card"><div class="world-tabs"><span class="tag">International</span><span class="tag">Afrique</span></div><h2>QI de personnalités connues</h2><p class="muted">Les chiffres supposés sont indiqués comme estimations ou non documentés lorsque nécessaire.</p><div class="rank-list">${people(celebritiesWorld.slice(0,5))}${people(celebritiesAfrica.slice(0,5))}</div><p class="note">Certaines attributions sont populaires sur Internet mais ne correspondent pas à un test moderne public. Cervo le signale clairement pour éviter d’induire en erreur.</p></section><section class="card"><span class="eyebrow">Défi entre amis</span><h2>Et toi, tu ferais quel score ?</h2><p>Partage ton indice Cervo et propose à tes proches de deviner leur résultat avant de jouer. Celui qui s’approche le plus remporte le badge <strong>Intuition d’or</strong>.</p><div class="row"><button id="share" class="btn">Partager mon défi</button><button id="copy" class="btn secondary">Copier le message</button><button id="whatsapp" class="btn secondary">Partager sur WhatsApp</button></div><button id="restart" class="btn secondary">Rejouer avec un autre prénom</button><div class="toast" id="toast" role="status"></div></section>`);
const share=`🧠 Défi Cervo QI ! ${S.name} a obtenu ${R.good}/22 bonnes réponses et un indice ludique de ${R.index}/145 (${S.memoStars} étoiles mémoire). Tu penses faire mieux ? Essaie Cervo QI et devine ton propre indice avant le résultat ! (Jeu de logique, pas un test clinique.)`;
$('#whatsapp').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(share+(location.protocol.startsWith('http')?' '+location.href:'')),'_blank','noopener,noreferrer');$('#copy').onclick=()=>copyText(share);$('#share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Cervo QI — Défi entre amis',text:share,url:location.protocol.startsWith('http')?location.href:undefined});}catch(e){if(e.name!=='AbortError')copyText(share);}}else copyText(share);};$('#restart').onclick=()=>{S={screen:'intro',name:'',i:0,ans:[],order:[],sequence:[],memoIndex:0,memoStars:0,guess:null,lock:false};screen();moveTop();};
}
async function copyText(value){try{await navigator.clipboard.writeText(value);$('#toast').textContent='Message copié. À partager avec tes amis !';}catch{const t=document.createElement('textarea');t.value=value;t.style.cssText='position:fixed;top:-1000px';document.body.appendChild(t);t.select();try{document.execCommand('copy');$('#toast').textContent='Message copié !';}catch{$('#toast').textContent=value;}t.remove();}}
function screen(){switch(S.screen){case'intro':intro();break;case'level':levelIntro();break;case'question':question();break;case'memoLearn':memolearn();break;case'memoRecall':memoRecall();break;case'guess':guess();break;case'results':results();break;}}
applyTheme();screen();window.addEventListener('pagehide',stopTimers);
})();
</script>
</body>
